<title>전기 마스터 타운</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
:root{
  /* Layout: 화면 전체가 블록 마을 캔버스이고, 그 위에 두꺼운 테두리의 게임 패널이 떠 있다 (흑연색 패널 + 에나멜선 구리색 + 안전 노랑) */
  --ink:#15202b; --ink-2:#1d2a38; --ink-3:#273848; --line:#3b5068;
  --paper:#f7f2e8; --paper-2:#ebe2d0;
  --text:#eef3f8; --text-dim:#a9b9cb; --text-dark:#1c2733; --text-dark-dim:#5a6878;
  --copper:#e2782b; --copper-2:#b85a19; --volt:#ffd23f;
  --ok:#25a862; --warn:#e5483a; --waste:#ee9a1c; --info:#3a8ee6;
  --font-display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --font-body:'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --shadow:0 4px 0 rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--font-body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--font-display);font-size:16px;letter-spacing:.02em;cursor:pointer;border:0;color:inherit}
input,textarea,select{font:inherit;font-size:15px;color:var(--text);background:var(--ink);border:2px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{resize:vertical;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--volt);outline:none}
:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink-3);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:8px 14px;box-shadow:var(--shadow);transition:transform .08s,border-color .15s;line-height:1.2}
.btn:hover{border-color:var(--volt)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.primary{background:var(--copper);border-color:#ffb27a;color:#fff}
.btn.volt{background:var(--volt);border-color:#fff3b0;color:#2a2200}
.btn.small{padding:5px 9px;font-size:14px;border-radius:8px}
.btn.ghost{background:transparent;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.on{background:var(--volt);color:#2a2200;border-color:#fff3b0}
kbd{font-family:var(--font-display);background:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:6px;padding:0 6px;font-size:13px}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud .top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(21,32,43,.9);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--font-display);font-size:15px;box-shadow:var(--shadow);white-space:nowrap}
.pill b{color:var(--volt);font-weight:400}
.pill.done{border-color:var(--volt);background:#3a3110}
#objective{margin-top:8px;max-width:min(520px,58vw);background:rgba(21,32,43,.9);border-left:5px solid var(--volt);padding:7px 11px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.45;box-shadow:var(--shadow)}
#objective b{font-family:var(--font-display);font-weight:400;color:var(--volt);font-size:15px;margin-right:4px}
#hudBtns{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
#minimap{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));border:3px solid var(--line);border-radius:8px;background:#0c141c;box-shadow:var(--shadow);pointer-events:auto;cursor:pointer;image-rendering:pixelated}
.touch #minimap{top:96px;bottom:auto;width:120px;height:88px}
#patrolBar,#customBar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;background:rgba(21,32,43,.94);border:3px solid var(--volt);border-radius:12px;padding:8px 12px;font-family:var(--font-display);font-size:17px;pointer-events:auto;box-shadow:var(--shadow);max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center}
#customBar{top:62px;bottom:auto;border-color:var(--line)}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--paper);color:var(--text-dark);border:3px solid #1c2733;border-radius:10px;padding:9px 14px;font-weight:700;box-shadow:var(--shadow);z-index:30;max-width:calc(100% - 32px);text-align:center;font-size:15px}
#toast.ok{border-color:var(--ok)}#toast.bad{border-color:var(--warn)}

/* 터치 조작 */
#touch{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;left:max(20px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:rgba(21,32,43,.5);border:3px solid rgba(255,255,255,.28);pointer-events:auto;touch-action:none}
#joyKnob{position:absolute;left:36px;top:36px;width:52px;height:52px;border-radius:50%;background:rgba(255,210,63,.9);box-shadow:0 3px 0 rgba(0,0,0,.35)}
#actBtn{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;background:var(--copper);color:#fff;font-size:18px;line-height:1.1;pointer-events:auto;box-shadow:0 5px 0 rgba(0,0,0,.4);border:3px solid #ffb27a;touch-action:manipulation}

/* 대화 상자 */
#dialog{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(780px,calc(100% - 32px));background:var(--paper);color:var(--text-dark);border:3px solid #1c2733;border-radius:12px;box-shadow:0 6px 0 rgba(0,0,0,.4);padding:14px 18px 12px;z-index:15;cursor:pointer}
#dialog .who{font-family:var(--font-display);font-size:21px;color:var(--copper-2)}
#dialog .line{font-size:17px;line-height:1.6;min-height:3.2em;margin:4px 0 6px}
#dialog .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--text-dark-dim);font-size:13px}

/* 타이틀 */
#title{position:absolute;inset:0;display:flex;align-items:center;padding:24px max(24px,env(safe-area-inset-left));background:linear-gradient(90deg,rgba(15,24,32,.94) 0%,rgba(15,24,32,.82) 42%,rgba(15,24,32,.1) 78%);z-index:10;overflow:auto}
.title-card{width:min(440px,100%);display:grid;gap:14px;margin-block:auto}
.logo{font-family:var(--font-display);font-size:clamp(46px,8vw,76px);line-height:.95;color:#fff;text-shadow:0 4px 0 var(--copper-2),0 9px 0 rgba(0,0,0,.35);text-wrap:balance}
.logo span{color:var(--volt)}
.tagline{font-family:var(--font-display);font-size:19px;color:var(--text-dim)}
.tagline b{color:var(--copper);font-weight:400}
.menu{display:grid;gap:8px}
.menu .btn{justify-content:space-between;text-align:left;font-size:19px;padding:12px 16px}
.menu .btn small{font-family:var(--font-body);font-size:12px;color:var(--text-dim);font-weight:400}
.menu .btn.primary small{color:#ffe6d2}
.title-foot{display:flex;gap:8px;flex-wrap:wrap}
.badgebar{display:flex;gap:8px;flex-wrap:wrap}

/* 모달 패널 */
#modal{position:absolute;inset:0;background:rgba(8,12,18,.6);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));z-index:20}
.panel{background:var(--ink-2);border:3px solid var(--line);border-radius:14px;box-shadow:0 8px 0 rgba(0,0,0,.4);width:min(760px,100%);max-height:100%;overflow:auto;padding:18px 20px 20px;position:relative}
.panel.wide{width:min(1120px,100%)}
.panel h2{font-family:var(--font-display);font-weight:400;font-size:28px;margin:0 44px 4px 0;color:var(--volt);text-wrap:balance}
.panel h3{font-family:var(--font-display);font-weight:400;font-size:20px;margin:16px 0 8px;color:#fff}
.panel .sub{color:var(--text-dim);margin:0 0 14px;font-size:14px;line-height:1.55}
.panel p{line-height:1.6}
.xbtn{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:10px;background:var(--ink-3);border:2px solid var(--line);font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--ink-3);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card.paper{background:var(--paper);color:var(--text-dark);border-color:#c9bda6}
.card h4{margin:0 0 6px;font-family:var(--font-display);font-weight:400;font-size:18px}
.note{background:#132231;border:2px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.55;color:var(--text-dim)}
.note b{color:var(--text)}
.warnbox{background:#3a1a16;border:2px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}
.okbox{background:#123423;border:2px solid var(--ok);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;white-space:nowrap;border:2px solid transparent}
.chip.good{background:#123d27;color:#8ff0b9;border-color:#25a862}
.chip.danger{background:#43181a;color:#ffaaa1;border-color:#e5483a}
.chip.waste{background:#40300d;color:#ffd38a;border-color:#ee9a1c}
.chip.skip{background:#2a3440;color:#c9d4de;border-color:#6f7b88}
.chip.weak{background:#123d27;color:#8ff0b9;border-color:#25a862}
.chip.strong{background:#43260f;color:#ffc08e;border-color:#e2782b}
.tblwrap{overflow-x:auto;border:2px solid var(--line);border-radius:10px}
.tbl{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.45}
.tbl th{background:var(--ink);font-family:var(--font-display);font-weight:400;font-size:15px;color:var(--text-dim)}
.tbl tr:last-child td{border-bottom:0}
.res-ok{color:#7fe0a6;font-weight:800}.res-bad{color:#ff9d92;font-weight:800}.res-mid{color:#ffd38a;font-weight:800}
.big-score{font-family:var(--font-display);font-size:44px;color:var(--volt);line-height:1}
.bar{height:12px;background:var(--ink);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--volt)}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.choice{padding:14px 10px;font-size:18px;border-radius:12px}
.choice.good{background:#174d31;border-color:#25a862}.choice.danger{background:#5a1f1c;border-color:#e5483a}.choice.waste{background:#56400f;border-color:#ee9a1c}
.scene-card{display:flex;gap:14px;align-items:center;background:var(--paper);color:var(--text-dark);border-radius:12px;padding:14px;border:3px solid #c9bda6}
.scene-card .ico{font-size:44px;line-height:1;min-width:64px;text-align:center}
.scene-card .txt{font-size:19px;font-weight:800;line-height:1.45}
.dev-head{display:flex;gap:14px;align-items:center}
.dev-head img,.dev-head .emo{width:72px;height:72px;font-size:52px;line-height:72px;text-align:center;background:var(--paper);border-radius:12px;border:3px solid #c9bda6}
.fieldset{display:grid;gap:6px;margin-bottom:10px}
.fieldset label{font-weight:800;font-size:14px;color:var(--text-dim)}

/* 실험실 */
.exp-wrap canvas{width:100%;height:auto;display:block;border-radius:10px;border:3px solid #c9bda6;background:#f3efe6}
.exp-ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.exp-card{background:var(--ink-3);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.exp-card.done{border-color:var(--ok)}
.exp-card .q{font-weight:800;margin-bottom:6px;line-height:1.45}
.exp-card label{display:flex;gap:6px;align-items:center;font-size:14px;padding:3px 0;cursor:pointer}
.exp-card .result{margin-top:8px;font-size:14px;line-height:1.55;color:var(--text-dim)}
.exp-card .result b{color:var(--volt)}

/* 크레인 */
.crane-wrap canvas{width:100%;height:auto;display:block;border-radius:10px;border:3px solid #3b5068;background:#cfe3ef;touch-action:none}
.crane-ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.crane-ctrl .hold{min-width:64px;font-size:22px}
.meter{font-family:var(--font-display);font-size:17px;background:var(--ink);border:2px solid var(--line);border-radius:8px;padding:6px 10px}
.meter b{color:var(--volt);font-weight:400}

/* 크레인 두뇌: 질문 길 (의사결정트리) */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.icard{background:var(--paper);color:var(--text-dark);border-radius:10px;padding:8px;border:2px solid #c9bda6;font-size:12.5px;line-height:1.45;min-width:0}
.icard img{width:100%;height:64px;object-fit:contain;display:block}
.icard b{font-size:14px;display:block;margin:2px 0}
.icard .lbl{margin-top:4px}
.attrs{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.ac{display:inline-block;border-radius:6px;padding:1px 5px;font-size:11.5px;font-weight:700;border:1.5px solid}
.ac.mat{background:#fbe3cf;border-color:#c87533;color:#7a3f12}.ac.wt{background:#dbe9fb;border-color:#3a8ee6;color:#1d4f86}
.ac.sz{background:#d9f3df;border-color:#25a862;color:#145c33}.ac.col{background:#efe2ff;border-color:#9a6ae0;color:#55308f}
.tree{overflow-x:auto;padding:6px 2px 12px}
.tnode{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tbox{min-width:190px;max-width:290px;background:var(--ink-3);border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.4;position:relative}
.tbox.q{border-width:3px}
.tbox.q .qk,.qcard .qk{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:1px 6px;margin-bottom:3px;background:rgba(0,0,0,.25)}
.tbox.q .qt{font-family:var(--font-display);font-size:18px;padding-right:26px}
.tbox.q.mat{border-color:#c87533;background:#3a2a1d}.tbox.q.mat .qt{color:#ffd0a8}
.tbox.q.wt{border-color:#3a8ee6;background:#1b2d45}.tbox.q.wt .qt{color:#b9dcff}
.tbox.q.sz{border-color:#25a862;background:#16352a}.tbox.q.sz .qt{color:#a8f0c4}
.tbox.q.col{border-color:#9a6ae0;background:#2c2142}.tbox.q.col .qt{color:#ddc8ff}
.tbox.q.dup{outline:3px dashed #ff9d92;outline-offset:2px}
.qwarn{margin-top:5px;font-size:12.5px;color:#ffd38a;line-height:1.45}
.tbox.empty{border-style:dashed;display:grid;gap:6px}
.tbox.empty.open{border-color:var(--volt);max-width:440px}
.tadd{display:flex;gap:6px;flex-wrap:wrap}
.tpick-t{font-size:13px;color:var(--text-dim);font-weight:700}
.tpick{display:flex;flex-wrap:wrap;gap:6px}
.qcard{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border-radius:10px;padding:6px 10px;border:2px solid;font-family:var(--font-display);font-size:16px;cursor:pointer;color:#fff}
.qcard.mat{background:#3a2a1d;border-color:#c87533}.qcard.wt{background:#1b2d45;border-color:#3a8ee6}.qcard.sz{background:#16352a;border-color:#25a862}.qcard.col{background:#2c2142;border-color:#9a6ae0}
.chip.big{font-size:14px;padding:6px 12px;cursor:pointer}
.tbox .del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:6px;background:var(--ink);font-size:14px;line-height:1}
.tbr{display:flex;flex-direction:column;gap:10px;border-left:3px solid var(--line);margin-left:16px;padding-left:12px}
.tb{display:flex;align-items:flex-start;gap:8px}
.tlab{font-family:var(--font-display);font-size:14px;padding:3px 8px;border-radius:6px;background:var(--ink);white-space:nowrap;margin-top:8px}
.tlab.yes{color:#7fe0a6}.tlab.no{color:#ff9d92}
.tarr{display:flex;flex-wrap:wrap;gap:4px;max-width:420px}
.tarr.none{font-size:12px;color:var(--text-dim)}
.tchip{font-size:12px;border-radius:999px;padding:2px 8px;background:#26313d;color:#d9e2ea;border:1px solid #3b4856}
.tchip.ok{background:#123d27;color:#8ff0b9;border-color:#25a862}.tchip.bad{background:#43181a;color:#ffaaa1;border-color:#e5483a}

/* 분류 학습 */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.bucket{background:var(--ink-3);border:2px solid var(--line);border-radius:12px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.bucket.good{border-color:#25a862}.bucket.danger{border-color:#e5483a}.bucket.waste{border-color:#ee9a1c}
.bucket h4{margin:0;font-family:var(--font-display);font-weight:400;font-size:19px;display:flex;justify-content:space-between}
.bucket ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;max-height:220px;overflow:auto}
.bucket li{display:flex;gap:6px;align-items:flex-start;background:var(--ink);border-radius:8px;padding:6px 8px;font-size:14px;line-height:1.4}
.bucket li span{flex:1;min-width:0;overflow-wrap:anywhere}
.bucket li button{background:none;color:var(--text-dim);font-size:15px;padding:0 2px}
.bucket .add{display:flex;gap:6px}
.bucket .add input{flex:1}
.kw{display:flex;gap:4px;flex-wrap:wrap;font-size:13px}
.kw span{background:var(--ink);border-radius:6px;padding:2px 7px}
.cards-src{display:grid;gap:6px;max-height:240px;overflow:auto}
.src{display:flex;gap:8px;align-items:center;background:var(--ink-3);border-radius:8px;padding:6px 8px;font-size:14px;flex-wrap:wrap}
.src span{flex:1;min-width:160px}
.hist{display:flex;gap:6px;align-items:flex-end;height:80px;padding:6px;background:var(--ink);border-radius:10px;border:2px solid var(--line);overflow-x:auto}
.hist div{width:30px;min-width:30px;background:var(--volt);border-radius:5px 5px 0 0;position:relative}
.hist div span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-dim)}

/* 맵 만들기 */
#editor{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr;grid-template-columns:210px 1fr;pointer-events:none;z-index:5}
#edTop{grid-column:1/3;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));background:rgba(21,32,43,.97);border-bottom:3px solid var(--line);pointer-events:auto}
#edTop input{width:180px}
#edPal{grid-row:2;overflow:auto;background:rgba(21,32,43,.97);border-right:3px solid var(--line);padding:10px max(10px,env(safe-area-inset-left));pointer-events:auto;display:flex;flex-direction:column;gap:6px}
#edPal h5{margin:8px 0 2px;font-family:var(--font-display);font-weight:400;font-size:15px;color:var(--text-dim)}
.tool{display:flex;align-items:center;gap:8px;width:100%;background:var(--ink-3);border:2px solid var(--line);border-radius:8px;padding:6px 8px;font-size:15px;text-align:left}
.tool i{width:22px;height:22px;border-radius:5px;display:inline-block;flex:none;border:2px solid rgba(0,0,0,.35);font-style:normal;text-align:center;line-height:18px;font-size:15px}
.tool.sel{border-color:var(--volt);background:#3a3110}
#edArea{grid-row:2;grid-column:2;pointer-events:none}
#edStatus{font-size:13px;color:var(--text-dim)}

.mart{display:grid;gap:10px}

.elabel .e1{background:#1f9d55;width:44%}.elabel .e2{background:#7cc242;width:56%}.elabel .e3{background:#f2d024;width:68%;color:#1c2733}.elabel .e4{background:#f39c34;width:82%}.elabel .e5{background:#e5483a;width:96%}

.receipt{max-width:640px;margin:0 auto;background:#fffdf7;color:var(--text-dark);border-radius:10px;padding:14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.25)}

.rc-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* 로봇 훈련소 */
.rb{max-width:760px;margin:0 auto;display:grid;gap:12px}

.rb-sec{text-align:left;background:#132231;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.rb-sec > b,.rb-sec h4{display:block;margin:0 0 6px;font-size:15px}
.rb-list{display:grid;gap:4px}
.rb-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;line-height:1.4;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.03)}

.rb-probes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.rb-probe{display:grid;gap:4px;justify-items:start;background:#0f1a26;border-radius:10px;padding:8px 10px}
.rb3{max-width:880px;margin:0 auto}
.rb-score{font-family:var(--font-display);font-weight:400;font-size:28px;color:var(--volt);margin-left:6px}
.rb-hist{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;margin:4px 0}

.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px}

.cp-opts{display:grid;gap:6px}
.cp-opts h4{margin:4px 0}
.btn.cp-o{justify-content:flex-start;text-align:left;font-size:15px;line-height:1.4}
.cp-made{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;text-align:left}
.cp-card{background:#fff8dc;color:var(--text-dark);border:2px solid #e2a93a;border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.45}
.cp-card span{font-size:24px}
.cp-card p{margin:2px 0}
.cp-card small{color:var(--text-dark-dim)}
.cp-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

.cp-cut.now{border-color:var(--volt)}
.cp-cut.full{border-color:var(--ok)}
.cp-plays{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.cp-play{display:grid;gap:4px;justify-items:start;text-align:left;background:var(--ink-3);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit}
.cp-play:hover{border-color:var(--volt)}
.cp-play span{font-size:30px}
.cp-play small{color:var(--text-dim);font-size:12px;line-height:1.4}
.cp-play.done{opacity:.55;border-color:var(--ok)}
.shop{max-width:860px;margin:0 auto;display:grid;gap:10px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.shop-grid.three{grid-template-columns:repeat(3,1fr)}.shop-grid.four{grid-template-columns:repeat(4,1fr)}
.shop-it{display:grid;gap:3px;justify-items:center;background:var(--ink-3);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px 6px;font:inherit;cursor:pointer}

.shop-it:disabled{opacity:.4}
.shop-bar{display:flex;justify-content:space-between;background:#132231;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px}

.shop-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.shop-clues{display:grid;gap:6px}
.clue{background:#132231;border:2px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--text-dim)}

.mf-art{display:grid;justify-items:center;gap:4px;background:#fff8e6;color:#5a4320;border:10px solid #d4a72c;box-shadow:inset 0 0 0 3px #a8822a,0 6px 0 rgba(0,0,0,.3);padding:18px 34px;border-radius:4px}
.mf-art span{font-size:64px;line-height:1}.mf-art small{font-weight:700}

.rb3-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#132231;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.rb3-lbl{font-size:15px;font-weight:700}

.rb3-steps li{background:#0f1a26;border:2px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--text-dim)}
.rb3-steps li.on{border-color:var(--volt);color:#fff;font-weight:700}
.rb3-steps li.done{border-color:var(--ok);color:#bff3d6}
.rb3-steps li.done::before{content:'✓ '}
.rb3-list{display:grid;gap:8px}
.rb3-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px;align-items:center;background:#132231;border:2px solid #7a2e2e;border-radius:12px;padding:8px 10px;text-align:left}

.rb3-q p{margin:0 0 4px;font-size:15px}
.rb3-ans{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--text-dim)}
.rb3-opts{display:grid;gap:5px}
.rb3-opts small{color:var(--volt);font-size:12px}
.rb3-o{display:flex;gap:6px;align-items:center;text-align:left;background:var(--ink-3);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit;font-size:14px;cursor:pointer}
.rb3-o:hover{border-color:#8aa0b6}
.rb3-o.on{border-color:var(--volt);background:#2f3a20;box-shadow:0 0 0 2px rgba(255,210,63,.25)}

.cp-gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}

/* 3D 무대 위에 떠 있는 미니 게임 화면: 가운데는 비워서 블록 3D 장면이 보이고 눌린다 */
#mg.d3{background:transparent;pointer-events:none}
#mg.d3 .mg-top,#mg.d3 .mg-say,#mg.d3 .mg-bot,#mg.d3 #mgRotate{pointer-events:auto;position:relative;z-index:1}
#mg.d3 .mg-top{background:rgba(16,26,38,.8);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
#mg.d3 .mg-bot:not(:empty){background:rgba(16,26,38,.62);border-radius:14px;padding:6px 8px}
#mg.d3 #mgBox{flex:1 1 auto;width:100%;max-width:none;min-width:0;min-height:140px;aspect-ratio:auto;background:transparent;border-color:transparent;box-shadow:none;pointer-events:none}
#mg.d3 #mgCard,#mg.d3 #mgPop,#mg.d3 #mgDom{pointer-events:auto}
#mg.d3 #mgCard{background:rgba(10,16,24,.74);border-radius:14px}
#mg.d3 #mgCount{background:transparent}
#mg.d3 #mgDom{inset:0 auto auto 50%;transform:translateX(-50%);width:min(1000px,100%);max-height:100%;background:rgba(16,26,38,.86);border:2px solid var(--line);border-radius:14px}
#mgStat.urgent{color:#ff8a80;animation:mgUrg .5s ease-in-out infinite alternate}
@keyframes mgUrg{to{transform:scale(1.12)}}
#hitFlash{position:absolute;inset:0;pointer-events:none;z-index:16;background:radial-gradient(ellipse at center,rgba(229,72,58,0) 35%,rgba(229,72,58,.6));opacity:0;transition:opacity .5s}
#hitFlash.on{opacity:1;transition:none}
#faint{position:absolute;inset:0;z-index:23;background:#0b0f15;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;animation:faintIn .5s}
#faint[hidden]{display:none}
#faint b{font-family:var(--font-display);font-weight:400;font-size:52px;color:#ff8a80}
@keyframes faintIn{from{opacity:0}to{opacity:1}}
#hpBar{letter-spacing:-2px}
#hpBar.low{animation:mgUrg .5s ease-in-out infinite alternate}

.ls-card{display:grid;gap:6px;align-content:start}
.ls-card.locked{opacity:.75}
.ls-star{font-size:12px;font-weight:800;background:var(--volt);color:#2a2200;border-radius:999px;padding:2px 8px;white-space:nowrap}
.ls-day{font-size:13px;color:var(--volt);font-weight:800;letter-spacing:.02em}
.ls-q{background:var(--ink-3);border-left:5px solid var(--volt);border-radius:8px;padding:10px 12px;line-height:1.5}
.panel h3.ls-h{display:flex;align-items:baseline;gap:8px;margin:16px 0 8px}
.panel h3.ls-h small{font-family:inherit;font-size:13px;color:var(--text-dim)}
